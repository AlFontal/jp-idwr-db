name: Publish Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      git_ref:
        required: true
        type: string
      data_artifact:
        description: "Artifact with the release datasets (from the refresh job)."
        required: false
        default: ""
        type: string
      data_tag:
        description: "Existing release whose datasets are republished (code-only releases)."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  build-data-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require exactly one data source
        env:
          DATA_ARTIFACT: ${{ inputs.data_artifact }}
          DATA_TAG: ${{ inputs.data_tag }}
        run: |
          # Never fall back silently: publishing old data under a new version would
          # pass every validation.
          if [[ -n "${DATA_ARTIFACT}" && -n "${DATA_TAG}" ]] || [[ -z "${DATA_ARTIFACT}" && -z "${DATA_TAG}" ]]; then
            echo "Set exactly one of data_artifact or data_tag" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Download refreshed datasets
        if: inputs.data_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.data_artifact }}
          path: dist-data
      - name: Fetch datasets from an existing release
        if: inputs.data_tag != ''
        env:
          DATA_TAG: ${{ inputs.data_tag }}
        run: uv run python scripts/fetch_release_data.py --version "${DATA_TAG}" --dest dist-data
      - name: Build data release assets
        run: |
          rm -f dist-data/.release_tag
          for name in bullet place_prefecture prefecture_en sentinel sex_prefecture unified; do
            test -f "dist-data/${name}.parquet" || { echo "Missing ${name}.parquet" >&2; exit 1; }
          done
          uv run --with duckdb --with jsonschema python -m jp_idwr_db.build_release_assets \
            --data-dir dist-data \
            --release-tag "${{ inputs.release_tag }}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release_tag }}" \
            --schema-path docs/manifest.schema.json
      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-data
          path: dist-data/*

  github-release:
    runs-on: ubuntu-latest
    needs: [build, build-data-assets]
    permissions:
      contents: write
    steps:
      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Download data artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-data
          path: dist-data
      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/*
            dist-data/*

  publish-pypi-token:
    runs-on: ubuntu-latest
    # The package resolves its default data release from its own version, so the
    # GitHub release with data assets must exist before the package is published.
    needs: [build, github-release]
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI with API token
        env:
          UV_PUBLISH_USERNAME: "__token__"
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
