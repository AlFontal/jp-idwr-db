name: Release

# Manual (code-only) releases republish the datasets of an existing release.
# Data refreshes are published by the Refresh Release workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, e.g. v2026.3.26"
        required: true
        type: string
      git_ref:
        description: "Git ref to checkout, e.g. refs/tags/v2026.3.26"
        required: true
        type: string
      data_tag:
        description: "Existing release whose datasets are republished, e.g. v2026.3.19"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-release.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      git_ref: ${{ inputs.git_ref }}
      data_tag: ${{ inputs.data_tag }}
    secrets: inherit
